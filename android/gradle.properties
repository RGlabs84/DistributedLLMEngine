# Keep the build gentle on a shared laptop: a 2 GB heap (enough for R8 on this app), at most
# four parallel workers, and the Kotlin compiler inside the Gradle process instead of a
# separate daemon that lingers (and holds memory) after the build.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
