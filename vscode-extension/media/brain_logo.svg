<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Neural glow effects -->
  <g transform="translate(32, 32) scale(8)" fill="none" stroke="url(#brainGrad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left Hemisphere -->
    <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04Z"/>
    <!-- Right Hemisphere -->
    <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04Z"/>
    <!-- Neural Convolutions / Synapses -->
    <path d="M12 8a2 2 0 0 0 2 2"/>
    <path d="M12 14a2 2 0 0 1 2 2"/>
    <path d="M12 8a2 2 0 0 1-2 2"/>
    <path d="M12 14a2 2 0 0 0-2 2"/>
    <!-- Circuit Synaptic Nodes -->
    <circle cx="6.5" cy="9.5" r="0.6" fill="#38bdf8"/>
    <circle cx="17.5" cy="9.5" r="0.6" fill="#c084fc"/>
    <circle cx="6" cy="15" r="0.6" fill="#38bdf8"/>
    <circle cx="18" cy="15" r="0.6" fill="#c084fc"/>
  </g>
</svg>

