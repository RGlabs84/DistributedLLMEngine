[pytest]
# The whole suite lives under tests/. Restricting collection here matters: the repository
# also contains "DLNE Backup - No Modifications Allowed/", builder/ and dist/, all of which
# hold files whose names pytest would otherwise try to import.
testpaths = tests

# The tests import the `engine` package straight from the repository root. `pythonpath`
# (pytest 7+) puts the rootdir on sys.path, so both `pytest` and `python -m pytest` work on
# a clean checkout with no packaging step and nothing installed into site-packages.
pythonpath = .

# Short tracebacks keep a failing assertion readable; strict markers turn a typo in a
# @pytest.mark name into an error instead of a silently ignored marker.
addopts = --strict-markers --tb=short
